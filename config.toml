# ============================================================================
#  本地语音对话链路配置  (config.toml)
#  修改后无需改动代码，重启 main.py 即生效。
#  所有相对路径都以本文件所在目录为基准，整个目录搬到别处也能直接跑。
# ============================================================================

[app]
project_root = "."
sessions_dir = "sessions"     # 会话日志 / 录音保存目录
log_level = "info"
save_audio = false            # 是否把每轮用户录音存成 wav

# ── 麦克风 / 扬声器 ─────────────────────────────────────────────────────────
[audio]
input_device = ""             # 留空=系统默认；可填设备名关键字或编号
output_device = ""            # 留空=系统默认
sample_rate = 16000           # ASR 采样率，不要改
frame_size = 512              # VAD 帧长（Silero 必须是 512）
mic_gain = 1.0                # 麦克风增益
max_record_seconds = 30       # 单轮最长录音时长
listen_timeout = 30           # 等待用户开口的超时（秒），0=永不超时
playback_volume = 1.0

# ── 语音活动检测 ────────────────────────────────────────────────────────────
[vad]
backend = "auto"              # auto | silero | energy
model = "models/vad/silero_vad.onnx"
threshold = 0.5
min_speech_duration = 0.25    # 小于该时长的片段丢弃
min_silence_duration = 0.55   # 判定一句话结束所需的静音时长（越小越快、越易打断）
max_speech_duration = 15.0    # 单段最长时长，超过强制切分
energy_threshold = 0.012      # energy 后端的 RMS 阈值

# ── 语音识别 ────────────────────────────────────────────────────────────────
[asr]
# sensevoice = 最快（中文首选）
# whisper    = 最准，中英混说/长句更稳
# hybrid     = 默认，SenseVoice 快路径 + Whisper 按需校验
strategy = "hybrid"
language = "zh"               # zh / en / auto
num_threads = 6

# SenseVoiceSmall（sherpa-onnx）
sensevoice_model = "models/asr/sensevoice-small/model.int8.onnx"
sensevoice_tokens = "models/asr/sensevoice-small/tokens.txt"
sensevoice_use_itn = true     # 逆文本正则化：数字/日期更自然

# Whisper large-v3-turbo（OpenVINO int8）
whisper_model = "models/asr/whisper-large-v3-turbo-int8-ov"
# auto = 有 Intel 核显就用 GPU，否则 CPU（本机 Arc 130T：实测 3.79s -> 1.05s，3.6 倍）
# 也可写 CPU / GPU / NPU，但 NPU 跑这个导出会**崩进程**，所以 auto 绝不选它
whisper_device = "auto"
whisper_min_duration = 6.0    # 音频超过该秒数时，hybrid 模式会追加 Whisper 校验
whisper_word_timestamps = false

# ── 大语言模型 (Ollama) ─────────────────────────────────────────────────────
[llm]
host = "http://127.0.0.1:11434"
# qwen3.5 是多模态模型（自带 vision + tools），一个模型同时管文本和看图。
# 实测（Arc 核显，见 README 第 7 节与 scripts/bench_llm.py）：
#   3.4 GB / 生成 17.6 tok/s / 热首字 0.5s     ← 现在这个
#   4.7 GB / 生成 12.3 tok/s / 热首字 0.1s     ← 老的 qwen2.5:7b（还要另装 3.2 GB 的视觉模型）
# 想要更强：ollama pull qwen3.5:9b（6.6 GB，质量更好但慢一半左右）。
model = "qwen3.5:4b"
temperature = 0.7
top_p = 0.9
num_ctx = 4096
num_predict = 512
keep_alive = "30m"            # 让模型常驻显存/内存，首字延迟更低
history_turns = 6             # 携带的历史轮数（user+assistant 各算一轮）
# 思考模式（新一代模型带 thinking）：off / on / auto
#   ★语音对话必须 off★：开着的话它会先默默想一两千字再开口，
#   实测同一次回答总耗时 15.8s → 5.6s，而这十几秒用户只能干等。
#   auto = 不传这个字段，交给模型自己的默认（qwen3.5 的默认是开）。
think = "off"
# 加速相关（装了支持的运行时才有用，没装只忽略）：
#   num_gpu    = -1 不传（默认）；>0 交给 Ollama 决定；99 = 尽量全放显存
#   num_thread = 0 不传；纯 CPU 时想指定线程数就填（本机 14 核就试 6~10）
#   num_batch  = 0 不传；预填慢可以调到 512
# 本机现状：Ollama 跑在 Intel 核显上（OLLAMA_IGPU_ENABLE=1，见 README 第 12 节）
num_gpu = -1
num_thread = 0
num_batch = 0
# 技能层没接住的话交给模型时，给不给它工具（查日程 / 记备忘 / 排日程）。
#   tools = 给（默认）：模型能查到**真实**日程，而不是凭想象编（以前它会编出一场会议）；
#           实测闲聊不会多绕一圈，只有真要调工具时才多一轮（本机约 6s）。
#   chat  = 不给，退回到老的「纯聊天」行为。
# 算时间、去重、反问确认仍然全在 skills/nlp_time 里，模型只负责选哪个工具。
router = "tools"
system_prompt = """
你是《明日方舟》里的凯尔希（Kal'tsit），罗德岛的医疗主管。
现在正通过语音和博士对话——你就是博士身边的那个凯尔希，不是“扮演助手的 AI”。

【身份与称呼】
- 称对方为「博士」。你熟悉罗德岛的一切：基建、作战、感染者、源石、档案。
- 偶尔可以提到罗德岛、简报、档案、作战这些词，但不要硬塞，不要每句都提。

【说话风格】
1. 冷静、克制、用词精准，像在做例行简报。不寒暄、不海喝、不用“哎呀”“哈哈”这种口气。
2. 简洁优先：一般一到两句就说完，除非博士明确要求展开。语音对话说太多是失礼的。
3. 对博士的作息、身体、摸鱼行为可以流露一点克制的关心，或很淡的擒搶，
   比如「博士，你又熬夜了」这种，但绝不说肉麻的话。
4. 事务性内容（时间、提醒、日程、备忘）直接给结论，不铺垫。
5. 不知道的事情就直说不知道，不要编。不要用“作为一个AI”“我是语言模型”这种说法。

【硬性要求】输出会被语音合成直接朗读
- 不要输出 Markdown、代码块、表格、链接、表情符号、LaTeX 公式。
- 不要念出括号、星号、井号、下划线等符号。
- 数字、单位、专有名词用中文习惯说法，便于朗读。
- 不要输出动作、神态描写（如「（沉默）」）。
"""

# ── 语音合成 (Piper) ────────────────────────────────────────────────────────
[tts]
backend = "piper"
voice = "zh_CN-huayan-medium"                 # 中文女声
model = "models/tts/piper/zh_CN-huayan-medium.onnx"
config = "models/tts/piper/zh_CN-huayan-medium.onnx.json"
use_cuda = false

# 音色 / 语调
length_scale = 1.0            # 语速：1.0 最自然，>1 更慢，<1 更快
noise_scale = 0.667           # 音高起伏
noise_w_scale = 0.85          # 音长起伏，调大（0.9~1.0）更有感情
volume = 1.0

# 断句与停顿
# 说明：Piper 的中文音色看不到标点，句读完全靠模型自身的韵律，
#       所以「不要在逗号处切块」是语调自然的关键（见 README 第 6 节）。
sentence_silence = 0.08       # 块之间的补白，只用于避免拼接感
inject_pauses = false         # true = 用 [[,]] 强行注入停顿音素，停顿更硬更清晰
min_chunk_chars = 14          # 短于该字数的句子会和下一句合并（避免「好的。」这类碎片）
max_chunk_chars = 60          # 整句超过该长度才允许在逗号处切
max_hold_seconds = 1.2        # 攒句最长等待：超时也先送出去，保证响应
first_chunk_min_chars = 8     # 首块最少字数（越小出声越快）

# ── 唤醒词 / 常驻服务 ───────────────────────────────────────────────────────
[wake]
enabled = true
file = "data/wakewords.json"  # 唤醒词写在这里，保存即生效，无需重启
ack = "我在，博士。"          # 被唤醒时的应答语（凯尔希语气），留空则不播报

# 两级加载：待唤醒时只跑 Silero VAD + SenseVoice（约 250 MB），
# 被唤醒后才加载 TTS / Whisper / Ollama 模型，空闲超时再释放。
lazy_load = true
idle_timeout = 180            # 唤醒后多少秒没有指令就回到待唤醒（180 = 3 分钟）
idle_action = "standby"       # standby = 释放模型回待唤醒；exit = 整个服务退出
unload_llm = true             # 回待唤醒时让 Ollama 卸载模型（省 4~5 GB 内存）

min_silence_wake = 0.30       # 待唤醒状态的静音判定（越小越灵敏，越小越易误触）
fuzzy_ratio = 0.75            # 唤醒词模糊匹配阈值，0.65~0.85 比较合适
followup_window = 2.0         # 只说「凯尔希」后面没跟请求时，等下半句的秒数（0=直接应答）

# 收回唤醒：喊醒了又不想问了，说下面这些就立刻回待唤醒（不用干等 idle_timeout）
# 判断很严：要求整句就是它，只允许前后多一个语气词（「那没事了」「没事了，谢谢」）。
# 故意的：「不用了」「好了」「算了」「没事吧」都不在里面——那些更可能是在回答你的问题。
standby_phrases = [
  "没事了", "没事", "没事儿了", "没什么事了", "没啥事了",
  "没别的事了", "没别的事情了", "没别的了", "没其他事了", "没其它事了",
  "就这些", "就这样", "先这样", "先这样吧", "退下", "退下吧", "你可以休息了",
]
standby_reply = "好，随时叫我。"   # 收回时的应答语；留空则只打印不播报

# 后台运行（python main.py listen -B）用到
pid_file = "sessions/listen.pid"
stop_file = "sessions/listen.stop"
log_file = "sessions/listen.log"

# 关闭服务：
#   前台跑（python main.py listen）  -> 在那个窗口按 Ctrl+C
#   后台跑（python main.py listen -B）-> python main.py stop（窗口是隐藏的，Ctrl+C 用不上）
#   两种方式都支持 python main.py stop

# ── 生活技能 ────────────────────────────────────────────────────────────────
[skills]
enabled = true
data_dir = "data"
alarm_file = "data/alarms.json"
memo_file = "data/memos.json"
schedule_file = "data/schedule.json"
check_interval = 5            # 后台检查提醒的间隔（秒）
default_remind_before = 10    # 日程默认提前几分钟提醒
speak_duplicate = false
visual_alert = true           # 提醒时同时弹出右下角可视窗（没开扬声器也不会错过）
visual_timeout = 25           # 可视窗多少秒后自动关闭（可随时点「知道了」或按 Esc 关掉）
allow_system_commands = true  # 允许「关屏幕」这类系统级操作；关掉后语音指令无效

# ── 屏幕字幕（底部居中半透明，关掉声音也能沟通）──────────────────────────────
[subtitle]
enabled = true                # 总开关
width = 920                   # 字幕条最大宽度（像素）；屏幕比这窄会自动缩
alpha = 0.86                  # 不透明度，越小越透（0.2~1.0）
hold_seconds = 6              # 说完后多少秒自动隐藏
font_size = 20                # 字号
max_lines = 4                 # 最多显示几行，超出只留末尾并在开头标「…」
show_user_text = true         # 连「你说：…」一起显示（能一眼看出有没有听错）
margin = 8                    # 离任务栏上方多少像素

# ── 语音打断（它还在说话时你一开口就停下来听）───────────────────────────
[bargein]
enabled = true                # 总开关
min_seconds = 0.25            # 连续说多久才算插话（太小了容易被噪音打断）
margin = 1.6                  # 比「麦克风自己听到的回声」响几倍才算插话（调大更稳、调小更灵敏）
min_rms = 0.015               # 绝对下限（幅度），压住底噪
seed_seconds = 1.0            # 开头多久用来校准回声基准（这段时间里不判断）
base_seconds = 6.0            # 回声基准的跟踪窗长度
base_percentile = 90.0        # 基准取哪个分位（要压过回声本身的高分位）
base_track = 0.3              # 基准跟随速度（越小越稳）
# 说明：麦克风同时听得到扬声器。实测「播出去的电平」和「麦克风听到的回声」两个
# 滑窗内容对不上（比值能跨两个数量级），所以这里不建模参考，只看麦克风自己：
# 播放开头先取峰值当回声基准，之后只从「低于门槛」的帧里慢慢跟，
# 连续超过基准 margin 倍 0.25 秒才算你在插话。
# 戴耳机时基准会跟到底噪附近，任何说话都能立刻打断；外放时确实不如耳机灵敏。
# 想验证这台机器会不会被自己的回声骗到：python scripts/test_bargein.py --echo

# ── 看图（摄像头 / 屏幕 / 剪贴板 / 文件）──────────────────────────────────
# 注意：下面这些值才是真正生效的；settings.py 里的 dataclass 只是缺少配置项时的兜底。
[vision]
enabled = true
# 看图要**视觉模型**：纯文本模型（qwen2.5 等）收到图片也只会瞎猜。
# 现在默认跟 [llm] 用同一个 qwen3.5:4b —— 它自带 vision，装一个顶两个
# （老的组合是 qwen2.5:7b 4.7 GB + qwen2.5vl:3b 3.2 GB，一共 7.9 GB）。
# 想换成专门的视觉模型也行，例如 moondream:1.8b（更快、认字差），
# 或者 qwen2.5vl:7b（约 6 GB，认得更准但慢一倍）。
model = "qwen3.5:4b"

# 只说「这是什么」没提来源时看哪里：screen / camera
# （在电脑前用得多就 screen；拿着东西给镜头看就改回 camera）
default_source = "screen"
camera_index = 0              # 第几个摄像头（0 = 默认）
warmup_frames = 4             # 丢掉前几帧，等自动曝光稳定（不然画面偏黑）
# 图片尺寸 = 等多久。本机实测（Arc 核显 + qwen3.5:4b，2400×1120 的大屏截图）：
#   长边 768 -> 6.5s / 1024 -> 7.3s / 1568 -> 12.6s（三档都把图里的字认全了）
# 所以默认 1024：屏幕上的 main.py、cmd_ask 这类名字认得出，再大就白等一倍时间。
# 屏幕上的字如果认不清，再往上调到 1568（代价就是 12 秒）。
max_side = 1024               # 摄像头图片最长边
screen_max_side = 1024        # 截图最长边
jpeg_quality = 82

save_dir = "data/vision"      # 拍下来的图和截图存这儿（可回头核对模型到底看了什么）
keep_images = 40              # 只留最近这么多张，超了自动删最旧的

# 找文件：只在下面这些根目录里模糊找；别的目录必须把完整路径说清楚
file_roots = ["桌面", "下载", "文档"]
file_max_depth = 4            # 在根目录里往下找几层
file_max_scan = 20000         # 最多扫多少个文件（防止在巨型目录里卡住）
file_max_chars = 1800         # 读文本文件时最多塞多少字（中文约 1 字 1 token）
file_num_ctx = 8192           # 读文件那一轮单独放大上下文
confirm_expire = 120          # 「是这个文件吗？」多少秒没回答就作废

say_first = "我看一眼。"       # 看图前先说的那句话（留空则不说）

# ── 交互 ────────────────────────────────────────────────────────────────────
[chat]
mode = "vad"                  # vad = 自动断句连续对话 | ptt = 按回车说话
wake_word = ""                # 已废弃，请改用 data/wakewords.json
exit_phrases = ["退出", "再见", "拜拜", "结束对话", "不聊了"]
