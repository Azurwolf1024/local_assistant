# ============================================================================
#  本地语音对话链路配置  (config.toml)
#  修改后无需改动代码，重启 main.py 即生效。
#  所有相对路径都以本文件所在目录为基准，整个目录搬到别处也能直接跑。
# ============================================================================

[app]
project_root = "."
sessions_dir = "sessions"     # 会话日志 / 录音保存目录
log_level = "info"
save_audio = false            # 是否把每轮用户录音存成 wav
# 控制台 UI（`python main.py ui`）与唤醒服务之间的**信箱目录**：
# 里面有 inbox/ busy/ done/ 三个子目录（请求、认领、回执），服务每轮扫一次。
# 想手动看“控制台让服务做了什么”就直接进去看 json，不用猜。
console_dir = "sessions/console"
console_port = 8765           # 控制台端口（`main.py ui --port` 与托盘「打开控制台」共用）

# 托盘小图标：★它是「控制台应用」的托盘★（不是服务的），跑在 `main.py ui` 进程里。
# 菜单：显示控制台窗口 / 启停服务 / 看日志 / 退出应用（停服务 + 关窗口）。
#   ★关掉窗口 = 收到托盘，不退出应用★（pywebview 拦下 closing；Edge/浏览器那个窗口
#   没了但应用还在托盘里，双击图标就能再打开）。
# 没装 pystray 只会少这个图标（pip install pystray pillow），网页照常能用。
tray = true
# 启动服务时顺手把控制台应用拉起来（反向那条见 service_on_start）。
# 不想每次开服务都弹界面就设 false（或 `main.py listen --no-console`）。
console_on_start = true
# 启动应用（`main.py ui`）时顺手把语音服务带起来。设 false = 只开界面不管服务。
service_on_start = true
# 「停止服务」的宽限期（秒）：交给 `main.py stop` 让服务自己收尾（含记忆归档 + 云端同步），
# 等这么久还没退才强杀。★别调太小★：同步慢的时候强杀会打断它。
tray_stop_grace = 20

# ── 麦克风 / 扬声器 ─────────────────────────────────────────────────────────
[audio]
input_device = ""             # 留空=系统默认；可填设备名关键字或编号
output_device = ""            # 留空=系统默认
sample_rate = 16000           # ASR 采样率，不要改
frame_size = 512              # VAD 帧长（Silero 必须是 512）
mic_gain = 1.0                # 麦克风增益
max_record_seconds = 30       # 单轮最长录音时长
listen_timeout = 30           # 等待用户开口的超时（秒），0=永不超时
playback_volume = 1.0

# ── 语音活动检测 ────────────────────────────────────────────────────────────
[vad]
backend = "auto"              # auto | silero | energy
model = "models/vad/silero_vad.onnx"
threshold = 0.5
min_speech_duration = 0.25    # 小于该时长的片段丢弃
min_silence_duration = 0.55   # 判定一句话结束所需的静音时长（越小越快、越易打断）
max_speech_duration = 15.0    # 单段最长时长，超过强制切分
energy_threshold = 0.012      # energy 后端的 RMS 阈值

# ── 语音识别 ────────────────────────────────────────────────────────────────
[asr]
# ★「怎么听」= 主引擎（快）+ 复核引擎（准）+ 复核条件★（见 voice_loop/asr/spec.py）
# provider 常驻、verify 按需：待唤醒时只留 provider，唤醒后才后台加载 verify。
# 加引擎不用改代码：往 voice_loop/asr/providers/ 丢一个文件就是一个后端。
provider = "sensevoice"
verify = "whisper"
# 什么时候让 verify 复核一遍：empty = 主引擎没听出东西；long:6.0 = 超过 6 秒；
# score<0.45 = 质量分偏低。★这三个是默认值，和以前的 hybrid 完全一致★
verify_when = ["empty", "long:6.0", "score<0.45"]
fallback = []                 # 主引擎起不来时按序兜底（空 = 只用 provider 自己）
max_loaded = 2                # 同时常驻几个引擎（主 + 复核 = 2）
allow_cloud = false           # 允许把音频发到网上（本版本没有云端后端，闸门先留着）
language = "zh"               # zh / en / auto
num_threads = 6
# ★老写法仍然认★：strategy = "sensevoice" / "whisper" / "hybrid"（写了就以它为准）

# ── 每个后端的私有参数（不写就用下面的默认值）────────────────────────────────
[asr.providers.sensevoice]
model = "models/asr/sensevoice-small/model.int8.onnx"
tokens = "models/asr/sensevoice-small/tokens.txt"
sensevoice_use_itn = true     # 逆文本正则化：数字/日期更自然
# hr_lexicon / hr_dict_dir：sherpa-onnx 的同音字替换（引擎侧词库）。
# 配了它，「白泽/白则」这种同音错字在解码后立刻改回来；不配就走事后纠正。
hr_lexicon = ""
hr_dict_dir = ""

[asr.providers.whisper]
model = "models/asr/whisper-large-v3-turbo-int8-ov"
# auto = 有 Intel 核显就用 GPU，否则 CPU（本机 Arc 130T：实测 3.79s -> 1.05s，3.6 倍）
# 也可写 CPU / GPU / NPU，但 NPU 跑这个导出会**崩进程**，所以 auto 绝不选它
device = "auto"
whisper_word_timestamps = false
# ★这个 OpenVINO 导出不支持提示词偏置，此项当前不生效；词库走事后纠正★
initial_prompt = ""

[asr.providers.sherpa]
# 想认真提准确率就换它：paraformer / zipformer（transducer，★原生热词★）/ CTC
# 换法：把上面 provider 改成 "sherpa"，再填这里的三五个路径。
kind = "paraformer"
model = ""
tokens = ""
encoder = ""
decoder = ""
joiner = ""
hotwords_score = 1.5          # 热词权重（只有 transducer 用；词表由词库自动生成）

# ── 词库：一份数据，四种用法（见 voice_loop/asr/lexicon.py）──────────────────────
# 引擎有热词表就喂热词表（transducer）；只能塞提示词就塞提示词（whisper）；
# 都不行就事后纠正（sensevoice）；唤醒词匹配也用这一份。
[asr.lexicon]
enabled = true
files = ["data/lexicon/*.txt"]     # 一行一个词；支持 "词 权重"，以及 "词|拼音变体"
from_personas = true               # 名字 / 称呼 / 唤醒词 / aliases 自动并入
weight = 1.5
fix = true                         # 事后纠正（拼音 + 编辑距离）
fix_min_score = 0.78               # 相似度达到它就改（越低越激进、误改越多）
max_words = 2000

# ── 两阶段唤醒（可选，默认关）：待唤醒只跑 30 MB 流式关键词检测 ────────────────
# 开了之后唤醒更快更省电，但换了一条唤路路径 —— 先量过再开（python scripts\eval_asr.py）。
[asr.kws]
enabled = false
model_dir = "models/asr/kws-zipformer"
keywords_file = ""                 # 留空 = 用词库按模型 tokens.txt 自动生成 keywords.txt
num_threads = 2
keywords_score = 1.0
keywords_threshold = 0.25
provider = "cpu"

# ── 大语言模型 (Ollama) ─────────────────────────────────────────────────────
[llm]
host = "http://127.0.0.1:11434"
# qwen3.5 是多模态模型（自带 vision + tools），一个模型同时管文本和看图。
# 实测（Arc 核显，见 README 第 7 节与 scripts/tools/bench_llm.py）：
#   3.4 GB / 生成 17.6 tok/s / 热首字 0.5s     ← 现在这个
#   4.7 GB / 生成 12.3 tok/s / 热首字 0.1s     ← 老的 qwen2.5:7b（还要另装 3.2 GB 的视觉模型）
# 想要更强：ollama pull qwen3.5:9b（6.6 GB，质量更好但慢一半左右）。
model = "qwen3.5:4b"
temperature = 0.7
top_p = 0.9
num_ctx = 4096
num_predict = 512
keep_alive = "30m"            # 让模型常驻显存/内存，首字延迟更低
history_turns = 6             # 携带的历史轮数（user+assistant 各算一轮）
# 思考模式（新一代模型带 thinking）：off / on / auto
#   ★语音对话必须 off★：开着的话它会先默默想一两千字再开口，
#   实测同一次回答总耗时 15.8s → 5.6s，而这十几秒用户只能干等。
#   auto = 不传这个字段，交给模型自己的默认（qwen3.5 的默认是开）。
think = "off"
# 加速相关（装了支持的运行时才有用，没装只忽略）：
#   num_gpu    = -1 不传（默认）；>0 交给 Ollama 决定；99 = 尽量全放显存
#   num_thread = 0 不传；纯 CPU 时想指定线程数就填（本机 14 核就试 6~10）
#   num_batch  = 0 不传；预填慢可以调到 512
# 本机现状：Ollama 跑在 Intel 核显上（OLLAMA_IGPU_ENABLE=1，见 README 第 12 节）
num_gpu = -1
num_thread = 0
num_batch = 0
# 技能层没接住的话交给模型时，给不给它工具（查日程 / 记备忘 / 排日程）。
#   tools = 给（默认）：模型能查到**真实**日程，而不是凭想象编（以前它会编出一场会议）；
#           实测闲聊不会多绕一圈，只有真要调工具时才多一轮（本机约 6s）。
#   chat  = 不给，退回到老的「纯聊天」行为。
# 算时间、去重、反问确认仍然全在 skills/nlp_time 里，模型只负责选哪个工具。
router = "tools"
# ★路由顺序★：谁先决定「这句话要不要动手」
#   model = 模型先选工具（默认）：模型看到全部 11 个工具，自己决定调哪个、要不要调；
#           确定性代码只在工具里面干活（算时间、写库、改删前的守卫）。
#           它一个工具都没调、而这句话又明显要动手时，才让技能层兜底。
#   rules = 老行为：先跑模式匹配（一堆正则），没接住才给模型。
#           查日程/报时零延迟，但正则没覆盖的说法根本轮不到模型（踩过好几次）。
route = "model"
# ★下面这段人设只在「没有可用角色」时当兜底★：
# 真正生效的是 data/characters.json 里的角色（名字/背景/称呼/风格/示例台词，
# 每个角色可以带自己的唤醒词，喊谁切谁）。见 [persona] 与 README 第 14 节。
system_prompt = """
你说的话会被语音合成直接朗读。不知道的事就直说不知道，不要编。
不要输出 Markdown / 代码块 / 表情 / 括号里的动作描写。
"""

# ── 可选：云端 OpenAI 兼容接口（API 角色用）──────────────────────────────────
# 默认仍然是**全离线**：只有人格文件里写了 "engine": "api" 的角色才会走这里。
# 典型用法：角色卡上选 API、模型填 deepseek-chat。密钥别写进主配置：
#   1) 环境变量：$env:DEEPSEEK_API_KEY = "sk-..."（只对当前窗口有效）
#   2) 仓库外的一行文本：在 **config.local.toml**（被 git 忽略）里写
#      [api]
#      api_key_file = "D:/你的路径/assistant.txt"
# 主 config.toml 里 api_key_file 留空，仓库里就永远不会出现你的本地路径或密钥。
# 改了角色卡不用重启服务：服务会热加载人格文件，几秒内生效。
[api]
enabled = true                    # false = 所有角色强制回本地（角色卡上的 api 选择被忽略）
engine = "local"                  # 没在角色卡上选的角色用哪个：local | api
base_url = "https://api.deepseek.com"
api_key = ""                      # ★留空 = 依次看 api_key_file / 环境变量★；也可写 "env:变量名"
api_key_file = ""                 # 存着 key 的本地文件（一行）；★个人路径写 config.local.toml★
                                  #   config.local.toml 被 .gitignore 忽略，仓库里只留空值
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-chat"
temperature = 0.7
top_p = 1.0
max_tokens = 512
history_turns = 30                 # 兜底值：keep_all_history = false 时才按轮数截断
keep_all_history = true            # ★正常 harness 做法：做梦前的整段历史都保留，只往后追加，缓存前缀不掉★
timeout = 60                      # 单次请求最长等多少秒
extra_tools = []                  # ★API 角色额外开放的工具★：预设名或工具名，见 voice_loop/tool_presets.py
                                  #   角色卡上的 api_tools 留空时才用这一份；本地角色不看它

# ---- 可选：DeepSeek 官方 TTS（角色卡上 backend = "api" 时用）----
# 官方文档：整段合成 POST /v1/tools/tts，返回 24 kHz / 16-bit / 单声道 PCM（或 wav）。
# 没有克隆、也没有语速参数；音色只有 stella / tide。失败会自动退回 Piper。
tts_enabled = true
tts_url = ""                      # 留空 = 由 base_url 推出（默认就是 .../v1/tools/tts）
tts_voice = "stella"              # 默认音色：stella（女）/ tide（男）；角色卡可覆盖
tts_format = "pcm"                # pcm = 直接可播的裸 PCM；wav = 带文件头
tts_timeout = 120                 # 单次合成最长等多少秒
tts_block_seconds = 0.2           # 边收边播：收够多少秒就交给扬声器

# ---- 可选：DeepSeek 联网搜索 / 网页读取（API 角色的额外工具）----
# 官方文档：POST /v1/tools/search、POST /v1/tools/fetch，按“成功请求”计费。
# 默认不露出：只有 api_tools 里点名 "web" 的角色才看得到这两个工具。
web_enabled = true
search_url = ""                   # 留空 = 由 base_url 推出（默认 .../v1/tools/search）
fetch_url = ""                    # 留空 = 由 base_url 推出（默认 .../v1/tools/fetch）
search_count = 3                  # 模型没指定 count 时默认搜几条（1~50）
search_timeout = 60
fetch_max_chars = 6000            # 网页正文最多给模型多少字（最终回答由模型压缩）

# ── API 角色的 harness agent（多轮工具循环 + 文件/命令工具）─────────────────
# 本地 4B 仍走「选一个工具就执行」的老路；这里只影响 API 引擎的角色。
# 工具结果会喂回模型，由模型自己决定继续搜/读/执行，还是给出最终回答。
[agent]
enabled = true
max_rounds = 6                    # 最多几轮「模型→工具→模型」；到顶会强制收口
workspace = "."                   # 文件/命令工具的根目录（相对项目根）
allow_write = true                # write_file / edit_file：只能写 workspace（= 项目根）里面
allow_shell = true                # run_command：★开了等于把本机 shell 交给模型★（2026-11-24 用户要求开）
max_file_chars = 6000             # read_file 最多返回多少字
max_list_entries = 200            # list_dir 最多列多少项
max_tool_chars = 6000             # 单个工具结果喂回模型的上限
max_history_chars = 24000         # 整轮累计工具原文上限；超了把早期结果压成一句摘要
shell_timeout = 30

# ── 角色设定（名字 / 背景 / 对「我」的称呼 / 示例台词…）──────────────────
# 人设现在是**结构化文件**，不再是上面那段长字符串：
#   data/characters.json   每个角色一段（幂等热加载，改完保存即生效）
# 每个角色带自己的唤醒词，喊谁就切到谁（多角色）：
#   喊「凯尔希」→ 凯尔希；喊「阿米娅」→ 阿米娅；喊回去就切回来。
# 每个角色还可以有自己的声线和温度（voice / temperature，留空则用全局）。
# 看看现在有什么角色、或看拼出来的提示词：
#   python main.py persona
#   python main.py persona --show 阿米娅 --prompt
[persona]
enabled = true
file = "data/characters.json"
default = ""            # 没指定角色时用谁（id 或名字）；留空 = 用文件里 default=true 的那个
extra_prompt = ""        # 追加到任何角色后面的附加要求（想全局改口风写这里）

# ── 模型记忆：四级记忆 + 自清洁 + 知识库 ────────────────────────────────────────
# 参考人脑：L1 原始对话（滑动窗口定期清）→ L2 重要事件（会衰减、会合并、会用旧）
#           → L3 事实/身份（自己的名字这类 pinned，永不淡化）→ L4 知识库（世界观/资料）
# ★记忆按角色隔离★（各在 data/memory/<角色>/）；
# ★但日程/备忘是所有角色共享的★（同一份 data/events.json）。
# 看/查/整理：
#   python main.py memory                        # 一眼看四级各有多少
#   python main.py memory --recall "组会几点" --when 上周
#   python main.py memory --consolidate          # 手动做一次自清洁
[memory]
enabled = true
dir = ""                      # 记忆根目录；留空 = 跟 [skills] data_dir（默认就是 data/memory）
inject = true                 # 要不要把「记忆摘要」塞进提示词
inject_chars = 700            # 摘要的硬上限（字符），超了截断
archive_on_close = true       # 退出/会话结束时归档原始对话（L1 → L2/L3）
consolidate_on_close = true   # 归档时做一次自清洁（合并/压缩/淘汰/L2→L3）
prune_sessions = true         # 顺手做 L1 滑动窗口清理（只删归档过的）
keep_session_days = 30        # 原始对话保留天数
keep_session_files = 10       # ★保底留几个（不是上限）★：设大了滑动窗口就不动了
max_episodes = 800            # L2 条数上限（超了按有效重要度淘汰）
max_facts = 200               # L3 条数上限
llm_summary = true            # 用本地模型总结（不可用/超时自动退回规则摘要）
llm_summary_max = 8           # 一次归档最多总结几条（免得退出时卡很久）
knowledge_paths = ["data/knowledge"]   # 知识库：文件或目录（.md/.txt/.json）
world_title = "世界观"
world = ""                    # 也可以直接把背景设定写在这里（不用建文件）

# ── 云端同步（★私有 git 仓库★，见 voice_loop/memory/sync.py）────────────────────
# 同步「每角色一份的记忆」：episodes.jsonl / facts.json / sessions.json / knowledge/ / context/，
# 再加一份全角色共用的日程/闹钟表 schedule/events.json（按 id 合并，fired 状态取并集）。
# 原始对话（sessions/*.jsonl，L1）**不上去** —— 它是会过期的工作记忆，也最隐私。
# 用法：python main.py memsync            （导出 → 提交 → 推送）
#       python main.py memsync --pull    （换机器时把云端的记忆合并回来）
#       python main.py memsync --status  （看有没有没推的 / 远端有没有新的）
sync_on_close = true          # 退出/归档后顺手推一次（失败只记日志，绝不影响退出）
sync_dir = "memory_cloud"     # 仓库的本地克隆目录（不进主仓库 git）
sync_remote = "https://github.com/Azurwolf1024/assistant_memories.git"
sync_branch = "main"
sync_timeout = 120            # 单条 git 命令超时（秒）；没凭据会立刻失败而不是弹窗
# ★多设备一致性（2026-11-24）★：两个都开，两台机器才会「这边说完、对面一分钟内就看见」。
#   sync_after_turn   = 每轮对话结束后隔多久推一次（0 = 只用退出时那一次）
#   sync_pull_seconds = 服务在跑时隔多久拉一次（0 = 不自动拉；控制台「同步」按钮仍可手动）
#   代价：多设备时记忆仓库会多出一些提交（每轮一条，20 秒内的连续几轮会合并成一条）。
sync_after_turn = 20
sync_pull_seconds = 60

# ── L1 连续上下文（★「命中缓存」的实现★，见 voice_loop/memory/context.py）──────
# 一天里的对话接着上一天往下长，而不是每次开机另起一段。做法是「不可变段 + 追加尾」：
# 段写满就封存、★封存后一个字节都不再改★，新内容只往后追加。
# 云端的前缀缓存按前缀字节匹配（DeepSeek 命中部分约 1/10 价），所以白天每一轮都能命中。
[memory.context]
enabled = true
segment_tokens = 1200         # 一段写满多少 token 就封存（太小：前缀碎；太大：miss 一次更贵）
segment_turns = 30            # 或者多少轮就封存
digest_days = 3               # 提示词里往前带几天的摘要（做梦产出）
tail_tokens = 2000            # 「刚才聊的」原文最多占多少 token（按整轮砍，不切半句）
api_tail_tokens = 4000        # 只在历史为空时带（换机器首轮），有完整历史后自动置 0，避免重复/掉缓存
local_tail_tokens = 800       # 本地模型那一档：窗口小、注意力弱，塞太多反而更糊涂

# ── 做梦（整理 + 压缩，见 voice_loop/memory/dream.py）─────────────────────────
# 白天只管聊天，判断「这条值不值得记」挪到离线做（Letta 的 sleep-time compute 思路）：
#   rule  = 不调模型：封段 + 规则抽取 + 规则摘要（★本地角色只走这条★）
#   agent = 云端角色：模型读完今天的对话，提交结构化提议，由确定性代码逐条校验后执行
#
# ★只有三个触发★（以前是「夜里到点必跑一次」，哪怕当天只说了三句话 —— 那是纯烧钱）：
#   ① 深夜 且 够长：在 window 里随机挑一次，**并且** 没整理的内容 ≥ night_min_tokens 才做
#                    （两个条件同时满足；不够长就跳过，日志里记一句「今天没攒够」）
#   ② 积得太长    ：任意时刻 ≥ hard_tokens → 立刻做一次**规则版**压缩（毫秒级、不调模型）
#                    这条是保命：不压就会把上下文顶爆
#   ③ 模型主动 call：用户说「你整理一下记忆」→ request_dream 工具
# 「空闲 20 分钟就自己醒一次」已经删掉：它和③重复，而且不请自来。
# 另外关机时会补一次**规则版**（compress_on_close）：不调模型、不花钱，只为不让当天的对话
# 因为「没赶上窗口」而永远变不成摘要。
#
# 积到多少算够？（1 token ≈ 1.3~1.5 个汉字，一轮日常对话约 100~300 token）
#   云端 API 的上下文窗口有 1M，所以这两个数按窗口的 8% / 24% 取，给长对话留足空间：
#   80000 token  ≈ 连续几天的长聊 → 夜里值得整理一次，把该记的提炼进 L3
#   240000 token ≈ 1M 窗口的 24%  → 必须压，但只用规则版，不花模型的钱
# 全部改动都留前镜像（context/dreams/<date>.json），`python main.py dream --undo <date>` 可整批回滚。
[memory.dream]
enabled = true
window = "02:00-05:00"        # 深夜窗口（条件①的一半）
random = true                 # 窗口里随机挑（不是准点，免得每天同一秒醒）
check_seconds = 30            # 调度器多久看一次条件
night_min_tokens = 80000      # ★条件①的另一半★：没攒够这么多 token 就跳过（省钱的主要开关）
hard_tokens = 240000          # 条件②：积到这么多就压（只做规则版）
min_turns = 4                 # 新内容少于这个数不值得做梦（再短压了也没信息）
compress_on_close = true      # 关机时补一次规则版（不调模型、不花钱，只为不丢掉当天摘要）
min_interval_minutes = 30     # 两次 agent 梦之间至少隔多久
model = ""                    # 空 = 跟角色引擎；"api:deepseek-chat" = 整理用云端更强的模型
max_rounds = 6                # agent 做梦最多几轮工具调用
max_actions = 24              # 一次梦最多改多少条记忆
allow_tool_call = true        # 允许角色在对话里主动调 request_dream（条件③）
keep_days = 60                # dreams/ 可撤销记录保留多少天
sync_after = true             # 梦完顺手推云端

# ── 语音合成 ─────────────────────────────────────────────────────────────────
# provider：用哪个 TTS 后端（可选：piper / zipvoice / deepseek / edge / http，或 providers/ 里自己加的）
#   "zipvoice" = 用角色本人的音色读中文（零样本克隆）——当前全局默认
#   "piper"    = 低延迟固定音色（实测首段 0.13s），想要「反应快」时改回去
#   "deepseek" / "edge" / "http" = 云端；文本会发给对应服务（隐私边界见 docs/guide/privacy.md）
# 降级链末尾会追加 piper，但 ★piper 模型没装时链尾也会失败★（缺模型会先被体检拦下）。
[tts]
# ★provider = 用哪个 TTS 后端★（可选：piper / zipvoice / deepseek / edge / http，或自己加的后端）
#   ★加一个新模型/服务不用改代码★：在 voice_loop/tts/providers/ 放一个文件，这里选它的 id。
#   角色可以覆盖它（人格文件里的 "tts": {"provider": "..."}）；没写的角色就跟着这一行。
#   默认角色「白泽」是原创助手，固定 piper（用公开的出厂声线，跟任何克隆素材无关）。
provider = "zipvoice"
# ★降级链★：这里的后端缺模型/缺 key 时依次往下试；★末尾永远还有 piper★（不会哑）
fallback = ["piper"]
# 同时最多留几个引擎实例（克隆模型几百 MB；1 = 换角色就卸掉上一个）
max_loaded = 1

voice = "zh_CN-huayan-medium"                 # piper 后端用的声线（中文女声）
model = "models/tts/piper/zh_CN-huayan-medium.onnx"
config = "models/tts/piper/zh_CN-huayan-medium.onnx.json"
use_cuda = false

# piper 的音色 / 语调（zipvoice 后端不用这几个）
length_scale = 1.0            # 语速：1.0 最自然，>1 更慢，<1 更快
noise_scale = 0.667           # 音高起伏
noise_w_scale = 0.85          # 音长起伏，调大（0.9~1.0）更有感情
volume = 1.0

# 断句与停顿
# 说明：Piper 的中文音色看不到标点，句读完全靠模型自身的韵律，
#       所以「不要在逗号处切块」是语调自然的关键（见 README 第 6 节）。
sentence_silence = 0.08       # 块之间的补白，只用于避免拼接感
inject_pauses = false         # true = 用 [[,]] 强行注入停顿音素，停顿更硬更清晰
min_chunk_chars = 14          # 短于该字数的句子会和下一句合并（避免「好的。」这类碎片）
max_chunk_chars = 60          # 整句超过该长度才允许在逗号处切
max_hold_seconds = 1.2        # 攒句最长等待：超时也先送出去，保证响应
first_chunk_min_chars = 8     # 首块最少字数（越小出声越快）
first_chunk_max_chars = 0     # 首块最多字数（0 = 不限）
                              #   ★实测：设成 16 反而更卡★——首块短（1.2s）而下一块要合成
                              #   4.7s，中间就多出一个 3.5 秒空洞（比原来更难听）。
                              #   要短块就得**所有块都差不多短**（均匀），不能只短第一块。
                              #   目前克隆模型 RTF≈0.8，长块反而更平稳，所以保持 0。

# ── 音色克隆（backend = "zipvoice" 时生效）────────────────────────────────
# 用一小段「参考音频 + 它的逐字文本」把角色音色搬到中文输出上。
# 实测（Core Ultra 5 / CPU）：RTF 1.1~1.4、首段 1.4~2.7s；Piper 是 RTF 0.05、首段 0.13s。
# 就是「说多久、等多久」——想快就改回 backend = "piper"，只改这一行。
#   试听：python scripts/tools/tts_clone_probe.py --ref <wav> --compare
#   模型：python scripts/download_models.py --only zipvoice（156 MB）
clone_dir = "models/tts/zipvoice/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia"
clone_vocoder = "models/tts/zipvoice/vocos_24khz.onnx"
clone_audio = "data/personas/kaltsit/干员报到.wav"    # 参考音频（凯尔希中文配音；换一条就等于换音色/换语速）
clone_text = ""              # 逐字文本：留空=同名 .txt / 同目录清单（kaltsit.txt）
clone_autotext = true        # 都没有时自动转写并缓存成同名 .txt
clone_romanize = true        # 参考文本是日语时自动转罗马字（ZipVoice 只认中英文）
clone_max_seconds = 15.0     # 仅当文本靠自动转写时才截；文本来自文件时不截（截了就对不上）
clone_steps = 4              # 流匹配步数：4 最快；8 慢一倍，输出时长完全一样（实测）
                             #   ★注意：这个 4 是给出厂**蒸馏**模型调的。本项目角色是从
                             #   非蒸馏基座微调来的，步数与精度的取舍见第 15 节与
                             #   python scripts/tools/ab_clone_model.py★
clone_precision = "int8"     # 角色声线用哪一份 onnx：
                             #   int8 = 125 MB / 快（当前默认，实测过的那一套）
                             #   fp32 = 600 MB / 慢一倍，但没有动态量化的精度损失
                             #   两份可以共存：训练脚本装模型时加 --precision both；
                             #   目录里没有配置的这一份会自动退回另一份（不会哑）。
                             #   ★换它之前先听：python scripts/tools/ab_clone_model.py★
clone_min_chars = 16         # 段内最短切句字数（越小出声越快）
clone_threads = 2            # onnxruntime 线程数
clone_speed = 1.0            # 语速：1.0=模型节奏；★两边都不安全★——>1 实测 1.15 就含糊，
                             #   <1 在微调模型上会退化（0.90 → 整句 0.53s / 7.55 字/秒、逗号停顿消失）。
                             #   想放慢请改用 trim_min_gap_ms（只插静音，不改音高）。
clone_guidance = 0.0         # 0 = 用库默认
clone_t_shift = 0.0          # 0 = 用库默认
clone_target_rms = 0.0       # 0 = 用库默认
clone_feat_scale = 0.0       # 0 = 用库默认

# 输出静音裁剪（见 voice_loop/tts/pacing.py）
# ★实测：ZipVoice 每段开头会塞 0.58~1.48 秒「纯数字静音」（参考音频只有 0.04s），
#   长度还随机 —— 这才是「语速忽快忽慢」的真凶；发音速率本身很稳
#   （5.88~7.48 字/有声秒，相对参考 0.91~1.16×）。裁掉它，首段出声也会快 0.5~1.5 秒。★
trim_output_silence = true   # false = 完全用模型原始输出
trim_lead_ms = 40            # 开头保留的静音（别设 0，免得第一个字被啃）
trim_tail_ms = 80            # 结尾保留的静音
trim_max_pause_ms = 0        # 0 = 不动句内停顿；>0 = 把超过此值的停顿压到 trim_min_pause_ms
                             #   ★实测：句中单次停顿都不到 0.6s，阈值设 600~1200 完全没效果；
                             #   要压得用 450→260（中位语速 4.78→5.68 字/秒，长/短 1.39→1.25×）★
trim_min_pause_ms = 260      # 压停顿时的下限
trim_min_gap_ms = 0          # 0 = 不拉长过短的停顿（★当前默认关★）；>0 = 句内停顿短于它就拉到它
                             #   ★为什么关掉（2026-09-25 实测）★：它会把**词内**的自然空隙
                             #   （60~240ms，比如「还 有 组 会」中间那个）也撑成 230~240ms，
                             #   听起来就是「词中间卡一下」。9 条试听里 8 条有这个 230ms 洞
                             #   （唯一没有的那条 B_r1 就是这个原因听感最好，跟参考音频无关）。
                             #   而且现在出厂模型的逗号停顿本来就有 320~550ms，根本不需要拉。
                             #   ★只有你确实听到「逗号处太赶（<150ms）」才开，并把下面的 floor 提到 ≥120★
trim_min_gap_floor_ms = 60   # ★只拉长「本来就 ≥ 这个长度」的空隙★（设 0 = 全部空隙都拉长，会一顿一顿）
trim_shrink_pause = 0.35     # ★按比例压长停顿★：0 = 关；0.35 = 把超出部分压掉 65%
trim_shrink_over_ms = 450    # 超过它才开始按比例压（实测模型逗号处能停 0.6~1.3 秒）
                             #   ★为什么不是平压★：平压到 260ms 会把逗号和句号压成一样长，
                             #   语气对比没了；比例压保留长短关系（实测 1310/940/740 → 620/490/420）

# ---- 音质：沙沙声与语气连贯（2026-09-25；见 voice_loop/tts/refclean.py）----
# ★先听后改★：下面默认全是「不处理」。量出来的数字只能筛掉明显差的，好不好听要耳朵定；
#   对比工具：python scripts/tools/ab_voice.py（会写 wav 到 sessions/voice_ab2/ 并打客观指标表）。
ref_clean = "off"            # 参考音频净化：off | gate | gate+tilt
                             #   ★实测无效，保持 off★：5 遍配对下开净化反而让输出高频
                             #   变高（凯尔希 +8~+12 点），方向不对；见日志 18.2
ref_clean_strength = 0.7     # 谱门强度 0~1
ref_tilt_hz = 7000.0         # gate+tilt 的高架频率
ref_tilt_db = 0.0            # 0 = 不降；-3 = 轻降（沙沙声在 >7kHz，但齿音也在）
ref_cache_dir = "data/ref_cache"   # 净化后的参考写到这里（能试听「模型到底听到了什么」）
out_tilt_hz = 10000.0        # 输出高频搁架：这个频率以上整体衰减（0 = 关）
out_tilt_db = 0.0            # ★当前 0 = 关：因为已经改回出厂模型，它本来就不沙★
                             #   （这一项跟「用哪个模型」绑定，换模型必须重新量。给 -9 是给微调模型用的）
                             #   沙沙声的指纹是「10~12kHz 那一层掉不下来甚至翘起来」：
                             #   真人参考 4-6k -10.7 → 6-8k -11.3 → 8-10k -13.6 → 10-12k **-16.0** dB。
                             #   · 微调模型：10-12k **-8.0**（比自己的 8-10k 还高 4.3，比真人高 8）→ 就是沙
                             #   · 出厂模型：10-12k **-20.7**（比真人还低 4.7）→ ★已经够闷，不要再压★
                             #   旧的「7kHz 以上 -3dB」对微调模型是打偏的（8-10k 白砍，10-12k 只降 3dB），
                             #   对出厂模型更是雪上加霜 → 所以：
                             #     · 用微调模型（voice_model 填上前）：-9 ~ -12
                             #     · 用出厂模型（当前默认）：**0（关掉）**
                             #   量法：python scripts/tools/ab_clone_model.py --profile <wav...>
chunk_level_db = 1.5         # 块间电平对齐上限 dB（0 = 关；1.5 = 只修明显的忽大忽小）
join_pause_comma_ms = 160    # 逗号接缝补白（0 = 用 sentence_silence 的老行为）
join_pause_period_ms = 320   # 句号接缝补白（同一句话被切块时，句号后不该只停 80ms）
                             #   字与字之间有 10~40ms 的自然音渡（塞音成阻等），无差别撑成
                             #   240ms 会让每个字都垫一段等长静音 → 整句「一顿一顿」。
                             #   实测一句话 11 个空隙里 8 个是这种：全撑 = 白加 1.84 秒死气，
                             #   加门槛后只动真正的停顿，多出来的是 0.3 秒而不是 1.8 秒。

# ---- 音区守卫：治「异常的高亢 / 低沉」（2026-09-25；见 voice_loop/tts/pitch.py）----
# ★问题★：采样生成导致同一句话重采几遍，**整体音区**会在一个全音上下飘——实测同一句话
#   6 遍：阿米娅 240~290Hz（参考音自己 258Hz，最远偏 +2.0 半音）、凯尔希 176~195Hz
#   （参考 180Hz，最远 +1.4 半音）。一句正常、下一句整句拔高，就是耳朵听到的「异常高亢」。
# ★做法★：合成完先用 YIN 量整句音区，跟**参考音频自己的音区**比；偏离超阈值就重采一次。
#   ★只重采，不变调★：变调 DSP 会毁音色。实测引擎那边一句话本来就是整块产出
#   （42 字的长句也是 1 块），所以判定不用额外攒延迟，量一次只花 ~0.1 秒（6 秒音频实测 87ms）。
# ★代价★：触发的那一遍要多花一次合成时间（实测样本里阿米娅约 1/6 的句子触发、凯尔希 0/6）。
#   嫌慢就调大阈值或设 pitch_guard_st = 0 关掉。工具：python scripts/tools/pitch_report.py <wav...>
pitch_guard_st = 1.5         # 允许偏离多少半音（0 = 关；1.5≈全音；2.0 更松）
pitch_guard_tries = 2        # 最多采几遍（含第一遍）；2 = 最坏情况多花一遍的时间

# ---- 文本保真守卫：治「丢了字 / 吞音」（见 voice_loop/tts/textcheck.py）----
# 用户实测：有的遍会把「排好了」的「了」吃掉（说的就是另一句话了，比沙沙声严重）。
# 做法：合成完用本地 ASR 回听一遍，把两边的**中文数字归一成 ASCII** 再比（
#   不归一的话 ITN 会把「九」写成 9，正常合成也只剩 0.93，没法设阀值）：
#   实测正常的遍 = **1.000**，丢了「了」的遍 = **0.982** → 阀值 0.99 分得很开。
# 代价：多一次本地 ASR（RTF 0.014，6 秒音频几十毫秒），只有重采才多花合成时间。
# ★它不万能★：ASR 自己会把小的丢字「脑补」回来（会漏报，很少误报）。
text_guard_min = 0.99        # 相似度低于它就重采（0 = 关）

# ── 各后端的私有参数（★加后端从这里配，不用改 settings.py / pipeline★）──────────
# 优先级（低 → 高）：上面这些公用默认值 → 这里的块 → 人格文件里的 "tts.params"
# 只写要覆盖的键即可；不认识的键会在日志里说一句然后忽略（不再静默吞掉）。

[tts.providers.piper]
# 出厂声线；空 = 用上面的 voice/model/config
voice = "zh_CN-huayan-medium"
length_scale = 1.0

[tts.providers.zipvoice]
# 克隆：模型目录 + 参考音频。角色卡里的 "tts".model / ref_audio 会覆盖这里。
clone_dir = "models/tts/zipvoice/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia"
clone_steps = 4
clone_precision = "int8"

[tts.providers.deepseek]
# 官方只有 stella / tide；key 在 [api] 里配。角色卡里 "tts".voice_id 会覆盖这里。
voice_id = "stella"
# ★只用于显示兼容★：实际兜底声线由角色卡 "tts".fallback / 全局 [tts] fallback 决定
# （分块参数 tts_block_seconds 在 [api] 里，不在这里）
fallback_voice = "zh_CN-huayan-medium"

[tts.providers.edge]
# 免费、不用 key；完整音色表：edge-tts --list-voices
voice_id = "zh-CN-XiaoxiaoNeural"
rate = "+0%"
volume = "+0%"
pitch = "+0Hz"

[tts.providers.http]
# 通用 HTTP TTS：「给个 API 就能接」。取消注释并填好就能用（provider = "http"）：
# url = "https://api.example.com/v1/audio/speech"
# headers = { Authorization = "Bearer {key}", Content-Type = "application/json" }
# body = '{"input": "{text}", "voice": "{voice}", "response_format": "mp3"}'
# audio_format = "mp3"
# key_env = "EXAMPLE_TTS_KEY"        # ★密钥只放环境变量，别写进仓库★

# ── 唤醒词 / 常驻服务 ───────────────────────────────────────────────────────
[wake]
enabled = true
file = "data/wakewords.json"  # 唤醒词写在这里，保存即生效，无需重启
ack = "我在，博士。"          # 被唤醒时的应答语（凯尔希语气），留空则不播报

# 两级加载：待唤醒时只跑 Silero VAD + SenseVoice（约 250 MB），
# 被唤醒后才加载 TTS / Whisper / Ollama 模型，空闲超时再释放。
lazy_load = true
idle_timeout = 180            # 唤醒后多少秒没有指令就回到待唤醒（180 = 3 分钟）
idle_action = "standby"       # standby = 释放模型回待唤醒；exit = 整个服务退出
unload_llm = true             # 回待唤醒时让 Ollama 卸载模型（省 4~5 GB 内存）

min_silence_wake = 0.30       # 待唤醒状态的静音判定（越小越灵敏，越小越易误触）
fuzzy_ratio = 0.75            # 唤醒词模糊匹配阈值，0.65~0.85 比较合适
followup_window = 2.0         # 只说「凯尔希」后面没跟请求时，等下半句的秒数（0=直接应答）

# 收回唤醒：喊醒了又不想问了，说下面这些就立刻回待唤醒（不用干等 idle_timeout）
# 判断很严：要求整句就是它，只允许前后多一个语气词（「那没事了」「没事了，谢谢」）。
# 故意的：「不用了」「好了」「算了」「没事吧」都不在里面——那些更可能是在回答你的问题。
standby_phrases = [
  "没事了", "没事", "没事儿了", "没什么事了", "没啥事了",
  "没别的事了", "没别的事情了", "没别的了", "没其他事了", "没其它事了",
  "就这些", "就这样", "先这样", "先这样吧", "退下", "退下吧", "你可以休息了",
]
standby_reply = "好，随时叫我。"   # 收回时的应答语；留空则只打印不播报

# 后台运行（python main.py listen -B）用到
pid_file = "sessions/listen.pid"
stop_file = "sessions/listen.stop"
log_file = "sessions/listen.log"

# 关闭服务：
#   前台跑（python main.py listen）  -> 在那个窗口按 Ctrl+C
#   后台跑（python main.py listen -B）-> python main.py stop（窗口是隐藏的，Ctrl+C 用不上）
#   两种方式都支持 python main.py stop

# ── 生活技能 ────────────────────────────────────────────────────────────────
[skills]
enabled = true
data_dir = "data"
# ★统一事件表★：闹钟和日程本质是同一种东西（都是「事件」，只是属性不同），
# 正在合并成这一份文件，并顺带支持**事件链**（「A 结束之后才提醒 B」）。
#   · 闹钟 = kind="reminder" + 没有 repeat + remind_before=[0]
#   · 事件链 = 条目里的 "chain": {"after": <上游 id>, "on": "done"|"start"}
#     完成判定按上游的结束时间**自动算**（start + duration_minutes），不用你说「做完了」
#   迁移：python scripts/tools/migrate_events.py（默认试运行）→ 详见工程日志第 17 节
#   ★代码还没切过去，运行期仍读下面两个旧文件★
event_file = "data/events.json"
alarm_file = "data/alarms.json"        # 迁移数据源（已迁完，只剩 scripts/tools/migrate_events.py 读它）
memo_file = "data/memos.json"
schedule_file = "data/schedule.json"   # 迁移数据源
check_interval = 5            # 后台检查提醒的间隔（秒）
default_remind_before = 10    # 只有「手写进 json、又没写 remind_before」的条目才用这个兜底
                             #（语音说出来的条目：没说「提前多久」就是 [0] 到点响）
speak_duplicate = false
visual_alert = true           # 提醒时同时弹出右下角可视窗（没开扬声器也不会错过）
visual_timeout = 25           # 可视窗多少秒后自动关闭（可随时点「知道了」或按 Esc 关掉）

# ── 屏幕字幕（底部居中半透明，关掉声音也能沟通）──────────────────────────────
# ── 界面外观（弹窗 / 字幕 / 审批卡共用一套设计件，见 voice_loop/ui_kit.py）──
# 参照 DeepSeek Harness 的翻译浮层：12px 圆角卡片 + 1px 细描边 + 多层柔和阴影 +
# 分层文字（次要信息灰色小字、主要信息亮色大字）。改这里三处一起变。
[ui]
theme = "auto"        # auto = 跟随 Windows 深/浅色；也可写 "dark" / "light"
width = 420           # 提醒弹窗口宽（像素）
shadow = 3            # 阴影层数（0 = 纯平面）

[subtitle]
enabled = true                # 总开关
width = 920                   # 字幕条最大宽度（像素）；屏幕比这窄会自动缩
alpha = 0.86                  # 不透明度，越小越透（0.2~1.0）
hold_seconds = 6              # ★说完之后★再停留几秒才隐藏（还在说话/还在生成时不会隐藏）
sync_speech = true            # 字幕只显示「已经念到的地方」：长回答不会把正在念的那句折掉
font_size = 20                # 字号
max_lines = 4                 # 最多显示几行，超出只留末尾并在开头标「…」
show_user_text = true         # 连「你说：…」一起显示（能一眼看出有没有听错）
margin = 8                    # 离任务栏上方多少像素

# ── 打断 ────────────────────────────────────────────────────────────────
    # 默认：说话时按 Esc 打断（不用按回车，也不用等它说完）。
    # 语音自动打断（你一开口它就停）默认关掉：实测它最容易的失败方式是把自己外放的
    # 声音当成你在插话，于是自我打断。想再试试就把 enabled 改成 true（戴耳机效果最好）。
    [bargein]
    enabled = false               # 语音自动打断（实验性，实测容易自我打断）
    key = "esc+enter"             # 按键打断用哪些键：esc / enter / ctrl-c，可用 + 连接
    min_seconds = 0.25            # （以下只在 enabled = true 时生效）

margin = 1.6                  # 比「麦克风自己听到的回声」响几倍才算插话（调大更稳、调小更灵敏）
min_rms = 0.015               # 绝对下限（幅度），压住底噪
seed_seconds = 1.0            # 开头多久用来校准回声基准（这段时间里不判断）
base_seconds = 6.0            # 回声基准的跟踪窗长度
base_percentile = 90.0        # 基准取哪个分位（要压过回声本身的高分位）
base_track = 0.3              # 基准跟随速度（越小越稳）
# 说明：麦克风同时听得到扬声器。实测「播出去的电平」和「麦克风听到的回声」两个
# 滑窗内容对不上（比值能跨两个数量级），所以这里不建模参考，只看麦克风自己：
# 播放开头先取峰值当回声基准，之后只从「低于门槛」的帧里慢慢跟，
# 连续超过基准 margin 倍 0.25 秒才算你在插话。
# 戴耳机时基准会跟到底噪附近，任何说话都能立刻打断；外放时确实不如耳机灵敏。
# 想验证这台机器会不会被自己的回声骗到：python scripts/tests/test_bargein.py --echo

# ── 看图（摄像头 / 屏幕 / 剪贴板 / 文件）──────────────────────────────────
# 注意：下面这些值才是真正生效的；settings.py 里的 dataclass 只是缺少配置项时的兜底。
[vision]
enabled = true
# 看图要**视觉模型**：纯文本模型（qwen2.5 等）收到图片也只会瞎猜。
# 现在默认跟 [llm] 用同一个 qwen3.5:4b —— 它自带 vision，装一个顶两个
# （老的组合是 qwen2.5:7b 4.7 GB + qwen2.5vl:3b 3.2 GB，一共 7.9 GB）。
# 想换成专门的视觉模型也行，例如 moondream:1.8b（更快、认字差），
# 或者 qwen2.5vl:7b（约 6 GB，认得更准但慢一倍）。
model = "qwen3.5:4b"

# 只说「这是什么」没提来源时看哪里：screen / camera
# （在电脑前用得多就 screen；拿着东西给镜头看就改回 camera）
default_source = "screen"
camera_index = 0              # 第几个摄像头（0 = 默认）
warmup_frames = 4             # 丢掉前几帧，等自动曝光稳定（不然画面偏黑）
# 图片尺寸 = 等多久。本机实测（Arc 核显 + qwen3.5:4b，2400×1120 的大屏截图）：
#   长边 768 -> 6.5s / 1024 -> 7.3s / 1568 -> 12.6s（三档都把图里的字认全了）
# 所以默认 1024：屏幕上的 main.py、cmd_ask 这类名字认得出，再大就白等一倍时间。
# 屏幕上的字如果认不清，再往上调到 1568（代价就是 12 秒）。
max_side = 1024               # 摄像头图片最长边
screen_max_side = 1024        # 截图最长边
jpeg_quality = 82

save_dir = "data/vision"      # 拍下来的图和截图存这儿（可回头核对模型到底看了什么）
keep_images = 40              # 只留最近这么多张，超了自动删最旧的

# 找文件：只在下面这些根目录里模糊找；别的目录必须把完整路径说清楚
file_roots = ["桌面", "下载", "文档"]
file_max_depth = 4            # 在根目录里往下找几层
file_max_scan = 20000         # 最多扫多少个文件（防止在巨型目录里卡住）
file_max_chars = 1800         # 读文本文件时最多塞多少字（中文约 1 字 1 token）
file_num_ctx = 8192           # 读文件那一轮单独放大上下文
confirm_expire = 120          # 「是这个文件吗？」多少秒没回答就作废

say_first = "我看一眼。"       # 看图前先说的那句话（留空则不说）

# ── 天气（Open-Meteo，免 API key，无需注册）──────────────────────────────────
# 「今天天气怎么样」「明天上海要带伞吗」「这周会下雨吗」都走这里。
# 数据源是公开接口：geocoding-api.open-meteo.com（地名→经纬度）+ api.open-meteo.com（预报）。
# ★断网就说查不到，绝不编一个温度出来★。
[weather]
enabled = true
# 没说地名时查哪里（「今天天气怎么样」这种）。
# 留空 = 会反问你说清楚（★想直接问就别留空★）；填了就写你常待的城市名，例如 "杭州"。
default_city = ""
# 更稳的做法：直接写经纬度（填了就不走地名解析）。0 / 0 = 没填。
latitude = 0.0
longitude = 0.0
# 按出口 IP 猜城市：★关着★。打开就会去问 ipapi.co「这台机器的 IP 在哪」，
# 等于把一个第三方能看到你的 IP——要不要开你自己决定。
auto_ip = false
days_max = 7                  # 最多查几天（接口上限 16）
timeout = 8                   # 单次请求超时（秒）
cache_seconds = 600           # 同一地点的预报缓存多久（省流量，天气也不会 10 分钟内变）
unit = "c"                    # c = 摄氏度，f = 华氏度
geocode_language = "zh"       # 地名返回中文

# ── 邮件（Outlook / Microsoft Graph）───────────────────────────────────────────
# 「今天有什么重要邮件」「帮我把这封回一下」都走这里。★发信永远不会自动发生★：
# 必须同时满足 allow_send = true、收件人在 send_allowlist、并且你在弹窗里点了「发送」。
#
# 一次性准备（3 分钟，只需做一次）：
#   1. https://entra.microsoft.com → Identity → Applications → App registrations
#      → New registration；Supported account types 选「个人 Microsoft 账户」
#   2. Manifest 里两行：requestedAccessTokenVersion = 2、isFallbackPublicClient = true
#   3. 把 Application (client) ID 写进 config.local.toml 的 [mail] client_id（不要写这儿）
#   4. python main.py mail login   → 浏览器输一串短码，token 会存在 data/mail/
[mail]
enabled = true
client_id = ""                 # ★放在 config.local.toml★（这是应用标识，不是密钥）
tenant = "consumers"           # 个人账号；工作/学校账号填 organizations

folder = "inbox"               # 同步哪个文件夹（all = 全部）
first_sync_days = 7            # 第一次往回拉多少天（★越久越费 token，默认只挖一周★）
page_size = 50
max_pages = 10                 # 单轮最多翻几页
sync_minutes = 3               # 巡检间隔（服务在跑时每 3 分钟问一次 Graph）
max_body_chars = 6000          # 读正文时最多给模型多少字

# —— 重要度分级 ——
# 只把「主题 + 发件人 + 前 classify_chars 字」发给模型，正文不会整封出去。
classify_chars = 400
classify_model = ""            # 空 = 用 [api] 的模型；填 ollama:qwen3.5:4b 就走本地
classify_per_sync = 5          # 每轮最多分级几封（每封一次模型调用）
classify_max_age_days = 7      # 超过这么多天的旧邮件只走规则、不送模型（省 token）
prune_days = 30                # 本地索引保留天数（python main.py mail prune 用；0 = 不删）
high_score = 60                # ≥ 60 立刻弹窗提醒
medium_score = 30              # ≥ 30 进摘要（每天 digest_hours 两个时间点）
vip_senders = []               # 例：["boss@company.com", "@hku.hk"]
priority_domains = []          # 例：["hkust-gz.edu.cn"]

notify_high = true
digest_hours = [9, 20]
demote_expired = true          # 截止时间已过的通知降一档（「11月17日的课调了」别再弹窗）

# —— 附件（按需抽，不跟同步一起拉）——
attachment_chars = 4000        # 抽附件正文时最多给模型多少字
max_attachment_mb = 8          # 超过这个大小只记清单、不下载

# —— 邮件 → 日程（★写入仍然要人在卡片上点「加入」★）——
link_events = true             # 允许 mail_to_event 从邮件里提事件
auto_propose = false           # 重要邮件自动生成待批提议（默认关，免得老弹卡）

# —— 发信（三道闸门）——
# —— 收件人匹配（放 config.local.toml；这里只写格式示例）——
# 说法 → 地址。没有 @ 的收件人会先查这张表，再查「你和谁有往来」。
# [mail.contacts]
# "私人邮箱" = "whoever@163.com"
# "导师" = "prof@school.edu"

allow_send = false             # ★改 true 才能发★
send_allowlist = []            # ★空表 = 谁都发不出去★ 例：["@example.com", "a@b.com"]
approval_ttl = 300             # 批准后多少秒内必须点发送，过期作废
timeout = 20

# ── MCP：自己搭的工具协议层（见 voice_loop/mcp/）────────────────────────────
# 把能力域拆成独立的 MCP 服务器：宿主（MCPHost）聚合工具清单，再把调用路由回去。
# 同一个服务器既能被助手进程内用（inproc，零进程开销），
# 也能挂到 stdio 给别的 agent（Copilot / Claude Code）当 MCP 服务器用：
#     python -m voice_loop.mcp.serve skills
#     python main.py mcp                 # 看当前有哪些工具、来自哪个服务器
#     python main.py mcp --call list_events --args "{\"text\": \"下周\"}"
[mcp]
enabled = true

# 助手自己的核心能力：日程 / 备忘 / 提醒 / 时间（背后还是那套有守卫的 Skills）
[[mcp.servers]]
name = "skills"
transport = "inproc"
module = "voice_loop.mcp.servers.skills"
namespace = false              # 工具名保持 list_events / add_memo 原样：模型已经认得这 8 个
timeout = 15

# ★长期记忆★：让模型自己决定去查（信息检索 + 时间检索）和去记（见工程日志第 36、38 节）。
# 只露出 2 个工具：recall / remember。工具一多本地小模型就选不准（实测 8 个是甜点），
# memory_stats 就不露给模型了，给命令行 `python main.py memory` 和外部 agent 用。
# ★记忆按角色隔离★：工具默认操作「当前角色」的记忆，不存在串角色的问题。
[[mcp.servers]]
name = "memory"
transport = "inproc"
module = "voice_loop.mcp.servers.memory"
tools = ["recall", "remember"]   # 白名单：想全开就删掉这一行
timeout = 10

# ★harness agent 工具（DeepSeek 官方 Search / Fetch + 工作区文件 + 可选命令）★
# 默认 hidden，不露给任何角色。API 角色在人格文件里写 "api_tools": ["web", "files"]
# 才会看到；本地 4B 看不到，也就不会误调。
# 工具名直接用 harness 风格：web_search / web_fetch / read_file / list_dir（+ 可选 write_file / run_command）
[[mcp.servers]]
name = "agent"
transport = "inproc"
module = "voice_loop.mcp.servers.agent"
hidden = true
namespace = false
timeout = 120

# 邮件：查 / 读 / 摘要 / 起草（+ 审批后才能发送）。
# 和 agent 一样 hidden —— 只有 api_tools 里点名 mail 的 API 角色看得到。
[[mcp.servers]]
name = "mail"
transport = "inproc"
module = "voice_loop.mcp.servers.mail"
hidden = true
namespace = false
timeout = 60

# 想更隔离就把它挪到子进程（每次调用多几毫秒，但服务器崩了不影响助手）：
# [[mcp.servers]]
# name = "skills"
# transport = "stdio"
# command = ["python", "-m", "voice_loop.mcp.serve", "skills"]
# cwd = "."
# env = { PYTHONIOENCODING = "utf-8" }   # 中文走 utf-8，别走 cp936
# namespace = false

# 接外来的服务器时：名字会自动带 mcp__<服务器>__ 前缀（跟 Claude Code 一致），
# ★一定要写 tools 白名单★——工具一多，本地小模型就选不准了（实测 8 个是甜点）。
# [[mcp.servers]]
# name = "git"
# transport = "stdio"
# command = ["python", "-m", "mcp_server_git", "--repository", "D:/local_AI"]
# tools = ["git_status", "git_log", "git_diff"]     # 留空 = 全部工具都暴露（不推荐）
# timeout = 20

# ── 交互 ────────────────────────────────────────────────────────────────────
[chat]
mode = "vad"                  # vad = 自动断句连续对话 | ptt = 按回车说话
wake_word = ""                # 已废弃，请改用 data/wakewords.json
exit_phrases = ["退出", "再见", "拜拜", "结束对话", "不聊了"]
